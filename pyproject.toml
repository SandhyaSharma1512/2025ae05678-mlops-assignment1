[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-heart-disease"
version = "0.1.0"
description = "MLOps assignment scaffold for UCI Heart Disease classification"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "pandas>=2.0,<3.0",
  "numpy>=1.24,<3.0",
  "scikit-learn>=1.3,<2.0",
  "joblib>=1.3,<2.0",
  "mlflow>=2.10,<4.0",
  "ucimlrepo>=0.0.7",
  "prometheus-client>=0.20,<1.0",
  "pydantic>=2.5,<3.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
