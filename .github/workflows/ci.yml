name: MLOps CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Lint
        run: ruff check src tests
      - name: Unit tests
        run: pytest -q
      - name: Download and prepare data
        run: python -m heart_disease.data --download
      - name: Train and log experiments
        run: python -m heart_disease.train
      - name: Upload model and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-artifacts
          path: |
            models/model.joblib
            reports/model_metrics.json
          if-no-files-found: warn
